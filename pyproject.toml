[project]
name = "chaos-to-symphony"
version = "1.0.0"
description = "From Chaos to Symphony: Orchestrating Agents with Microsoft Agent Framework - Baltic Summit 2026"
requires-python = ">=3.10"
dependencies = [
    "agent-framework>=1.19.0",
    "agent-framework-orchestrations>=1.2.0",
    "agent-framework-devui>=1.0.0b260918",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
azure = ["agent-framework-azure-ai"]
dev = ["ruff>=0.8", "pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
chaos-devui = "chaos_to_symphony.devui_app:main"
chaos-web = "chaos_to_symphony.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_to_symphony"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
