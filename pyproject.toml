[project]
name = "chaos-to-symphony"
version = "1.0.0"
description = "From Chaos to Symphony: Orchestrating Agents with Microsoft Agent Framework - Baltic Summit 2026"
requires-python = ">=3.10"
# Deliberately NOT the `agent-framework` meta-package: it pulls every provider
# (bedrock, gemini, mistral, ollama, qdrant, cosmos...) for a 920MB install,
# against 97MB for these. Nothing here imports them, and on a scale-to-zero
# container the difference is cold-start time in front of an audience.
dependencies = [
    "agent-framework-core>=1.19.0",
    "agent-framework-orchestrations>=1.2.0",
    "agent-framework-devui>=1.0.0b260918",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Needed only to run against a real model. Offline needs neither.
openai = ["agent-framework-openai>=1.14"]          # OpenAI *and* Azure OpenAI
foundry = ["agent-framework-foundry>=1.13", "azure-identity>=1.19"]
dev = ["ruff>=0.8", "pytest>=8.0", "pytest-asyncio>=0.24", "playwright>=1.48"]

[project.scripts]
chaos-devui = "chaos_to_symphony.devui_app:main"
chaos-web = "chaos_to_symphony.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_to_symphony"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# deck/content.py is prose, not code: the slide bullets are data and reflowing
# them at 120 columns makes the deck harder to edit, not easier.
"deck/content.py" = ["E501"]
